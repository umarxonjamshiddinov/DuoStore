<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена — DUO STORE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111111'/%3E%3Ctext x='50' y='69' font-family='Arial' font-size='54' font-weight='bold' text-anchor='middle' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/store.css">
    <style>
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
        .error-content { text-align: center; max-width: 480px; }
        .error-code { font-family: var(--font-display); font-size: clamp(72px, 20vw, 120px); font-weight: 500; line-height: 1; color: var(--accent); margin-bottom: 16px; }
        .error-title { font-family: var(--font-display); font-size: 32px; font-weight: 500; margin-bottom: 16px; }
        .error-text { font-size: 16px; color: var(--text-secondary); margin-bottom: 32px; }
        .error-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">Страница не найдена</h1>
        <p class="error-text">Похоже, эта страница была перемещена или никогда не существовала.</p>
        <div class="error-actions">
            <a href="index.html" class="btn btn--primary">На главную</a>
            <a href="index.html#catalog" class="btn btn--secondary">В каталог</a>
        </div>
    </div>
</div>
</body>
</html>
